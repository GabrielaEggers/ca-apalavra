<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caça-Palavras: Conhecimentos Gerais por Fases</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121820;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #f59e0b;
      margin-bottom: 4px;
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }
    p.subtitle {
      color: #10b981;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      position: relative;
      max-width: 550px;
      width: 100%;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(15, 32px);
      grid-template-rows: repeat(15, 32px);
      gap: 2px;
      background-color: #1e293b;
      padding: 10px;
      border-radius: 12px;
      user-select: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    .cell {
      width: 32px;
      height: 32px;
      background-color: #0f172a;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.15s, color 0.15s;
    }
    .cell:hover {
      background-color: #334155;
    }
    .cell.selected {
      background-color: #d97706;
      color: #fff;
    }
    .cell.found {
      background-color: #059669 !important;
      color: #fff;
    }

    /* Painel Inferior de Palavras (Lado a Lado) */
    .words-panel {
      background-color: #1e293b;
      padding: 16px 20px;
      border-radius: 12px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid #334155;
      text-align: center;
    }
    .words-panel h2 {
      font-size: 1rem;
      color: #f59e0b;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    ul#word-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 18px;
    }
    li {
      font-size: 0.9rem;
      color: #cbd5e1;
      font-weight: 600;
      letter-spacing: 1px;
      background-color: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      transition: all 0.2s;
    }
    li.found-word {
      text-decoration: line-through;
      color: #34d399;
      background-color: rgba(5, 150, 105, 0.2);
      border-color: #059669;
    }

    /* Modal de Mudança de Fase */
    #phase-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 12px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    #phase-modal h2 {
      color: #10b981;
      font-size: 2rem;
      margin-bottom: 10px;
    }
    #phase-modal p {
      color: #cbd5e1;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }
    #next-btn {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      color: #0f172a;
      background-color: #f59e0b;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }
    #next-btn:hover {
      background-color: #10b981;
      color: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>Caça-Palavras Global</h1>
  <p class="subtitle" id="phase-label">Fase 1: Geografia e História</p>

  <div class="game-container">
    <div id="grid"></div>
    
    <div class="words-panel">
      <h2>Palavras Ocultas</h2>
      <ul id="word-list"></ul>
    </div>

    <div id="phase-modal">
      <h2 id="modal-title">FASE CONCLUÍDA!</h2>
      <p id="modal-desc">Você dominou esta etapa do conhecimento global.</p>
      <button id="next-btn" onclick="nextPhase()">Próxima Fase</button>
    </div>
  </div>

  <script>
    const GRID_SIZE = 15;

    // Fases Temáticas
    const STAGES = [
      {
        name: "Fase 1: Geografia e História",
        words: [
          "MESOPOTAMIA",
          "KILIMANJARO",
          "CONSTANTINOPLA",
          "ANTARTIDA",
          "VERSALHES",
          "PANGEIA",
          "MADAGASCAR",
          "HIMALAIA"
        ]
      },
      {
        name: "Fase 2: Ciência e Astronomia",
        words: [
          "BIODIVERSIDADE",
          "ESTRATOSFERA",
          "ECLIPSE",
          "FOTOSSINTESE",
          "SUPERNOVA",
          "TELESCOPIO",
          "CROMOSSOMA",
          "GRAVIDADE"
        ]
      },
      {
        name: "Fase 3: Humanidades e Cultura",
        words: [
          "RENASCIMENTO",
          "FILOSOFIA",
          "ARQUEOLOGIA",
          "HEGEMONIA",
          "DEMOCRACIA",
          "MITOLOGIA",
          "LITERATURA",
          "ILUMINISMO"
        ]
      }
    ];

    let currentPhase = 0;
    let grid = [];
    let selectedCells = [];
    let isMouseDown = false;
    let foundWordsCount = 0;

    const wordListEl = document.getElementById('word-list');
    const gridEl = document.getElementById('grid');
    const phaseLabel = document.getElementById('phase-label');
    const phaseModal = document.getElementById('phase-modal');

    // Direções: [dx, dy]
    const DIRECTIONS = [
      [0, 1],   // Direita
      [1, 0],   // Baixo
      [1, 1],   // Diagonal Baixo-Direita
      [-1, 1],  // Diagonal Cima-Direita
      [0, -1],  // Esquerda
      [-1, 0],  // Cima
      [-1, -1], // Diagonal Cima-Esquerda
      [1, -1]   // Diagonal Baixo-Esquerda
    ];

    function placeWord(word) {
      let placed = false;
      let attempts = 0;

      while (!placed && attempts < 500) {
        attempts++;
        const dir = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
        const startX = Math.floor(Math.random() * GRID_SIZE);
        const startY = Math.floor(Math.random() * GRID_SIZE);

        const endX = startX + dir[0] * (word.length - 1);
        const endY = startY + dir[1] * (word.length - 1);

        if (endX >= 0 && endX < GRID_SIZE && endY >= 0 && endY < GRID_SIZE) {
          let canPlace = true;

          for (let i = 0; i < word.length; i++) {
            const x = startX + dir[0] * i;
            const y = startY + dir[1] * i;
            if (grid[x][y] !== '' && grid[x][y] !== word[i]) {
              canPlace = false;
              break;
            }
          }

          if (canPlace) {
            for (let i = 0; i < word.length; i++) {
              const x = startX + dir[0] * i;
              const y = startY + dir[1] * i;
              grid[x][y] = word[i];
            }
            placed = true;
          }
        }
      }
    }

    function fillEmptySpaces() {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (grid[r][c] === '') {
            grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
          }
        }
      }
    }

    function loadPhase() {
      const stage = STAGES[currentPhase];
      phaseLabel.textContent = stage.name;
      foundWordsCount = 0;
      grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));

      wordListEl.innerHTML = '';
      gridEl.innerHTML = '';
      phaseModal.style.display = 'none';

      stage.words.forEach(word => placeWord(word));
      fillEmptySpaces();

      // Renderizar Palavras Ocultas Lado a Lado
      stage.words.forEach(word => {
        const li = document.createElement('li');
        li.textContent = word;
        li.id = `word-${word}`;
        wordListEl.appendChild(li);
      });

      // Renderizar Grade
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.textContent = grid[r][c];
          cell.dataset.row = r;
          cell.dataset.col = c;

          cell.addEventListener('mousedown', () => startSelection(cell));
          cell.addEventListener('mouseenter', () => handleMouseEnter(cell));
          cell.addEventListener('mouseup', endSelection);

          gridEl.appendChild(cell);
        }
      }
    }

    function startSelection(cell) {
      isMouseDown = true;
      clearSelection();
      selectCell(cell);
    }

    function handleMouseEnter(cell) {
      if (isMouseDown) selectCell(cell);
    }

    function selectCell(cell) {
      if (!selectedCells.includes(cell)) {
        cell.classList.add('selected');
        selectedCells.push(cell);
      }
    }

    function clearSelection() {
      selectedCells.forEach(cell => {
        if (!cell.classList.contains('found')) {
          cell.classList.remove('selected');
        }
      });
      selectedCells = [];
    }

    function endSelection() {
      if (!isMouseDown) return;
      isMouseDown = false;

      const stage = STAGES[currentPhase];
      const selectedWord = selectedCells.map(cell => cell.textContent).join('');
      const reversedWord = selectedWord.split('').reverse().join('');

      let matchedWord = null;
      if (stage.words.includes(selectedWord)) matchedWord = selectedWord;
      else if (stage.words.includes(reversedWord)) matchedWord = reversedWord;

      if (matchedWord) {
        const listEl = document.getElementById(`word-${matchedWord}`);
        if (listEl && !listEl.classList.contains('found-word')) {
          listEl.classList.add('found-word');
          selectedCells.forEach(cell => cell.classList.add('found'));
          foundWordsCount++;

          if (foundWordsCount === stage.words.length) {
            setTimeout(showPhaseModal, 300);
          }
        }
      }

      clearSelection();
    }

    function showPhaseModal() {
      const modalTitle = document.getElementById('modal-title');
      const modalDesc = document.getElementById('modal-desc');
      const nextBtn = document.getElementById('next-btn');

      if (currentPhase + 1 < STAGES.length) {
        modalTitle.textContent = "FASE CONCLUÍDA!";
        modalDesc.textContent = `Preparado para a ${STAGES[currentPhase + 1].name}?`;
        nextBtn.style.display = 'inline-block';
      } else {
        modalTitle.textContent = "JOGO CONCLUÍDO!";
        modalDesc.textContent = "Parabéns! Você encontrou todas as palavras em todas as fases de conhecimentos gerais.";
        nextBtn.style.display = 'none';
      }

      phaseModal.style.display = 'flex';
    }

    function nextPhase() {
      currentPhase++;
      loadPhase();
    }

    document.addEventListener('mouseup', endSelection);
    loadPhase();
  </script>
</body>
</html>
