<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defensores do Espaço - Modo Campanha</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #050515;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #02020a;
      cursor: none;
    }
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      z-index: 5;
    }
    .score { color: #00e5ff; }
    .level { color: #ffcc00; }
    .health { color: #ff0055; }

    #level-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 21, 0.92);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      padding: 20px;
    }
    #level-screen h2 {
      font-size: 2rem;
      color: #00ff88;
      margin-bottom: 10px;
    }
    #level-screen p {
      font-size: 1rem;
      margin-bottom: 20px;
      color: #ccc;
    }
    #next-btn {
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #050515;
      background-color: #00e5ff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
      transition: transform 0.2s, background-color 0.2s;
    }
    #next-btn:hover {
      background-color: #00ff88;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="score">Pontos: <span id="score-val">0</span></div>
      <div class="level">Fase: <span id="level-val">1</span></div>
      <div class="health">Escudo: <span id="health-val">100</span>%</div>
    </div>

    <div id="level-screen">
      <h2 id="level-title">SETOR LIMPO!</h2>
      <p id="level-summary">Preparando hiperespaço...</p>
      <button id="next-btn" onclick="startNextLevel()">Iniciar Próxima Fase</button>
    </div>

    <canvas id="canvas" width="480" height="640"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const levelScreen = document.getElementById('level-screen');

    // Definição Completa das Fases
    const STAGES = [
      {
        name: "Fase 1: Cinturão de Rochas",
        bg: "#03030c",
        obsColor: "#ff5533",
        obsType: "meteor",
        bossColor: "#aa00ff",
        bulletColor: "#00e5ff",
        targetKills: 10,
        obsSpeed: 3,
        spawnRate: 35,
        desc: "Asteroides clássicos e lentos. Ideal para aquecimento."
      },
      {
        name: "Fase 2: Campo Tóxico Acid",
        bg: "#0a1a0a",
        obsColor: "#00ff66",
        obsType: "crystal",
        bossColor: "#ffff00",
        bulletColor: "#ff00ff",
        targetKills: 15,
        obsSpeed: 4.5,
        spawnRate: 25,
        desc: "Cristais venenosos mais velozes e resistentes."
      },
      {
        name: "Fase 3: Rede Synthwave",
        bg: "#1a001a",
        obsColor: "#ff0077",
        obsType: "grid",
        bossColor: "#00e5ff",
        bulletColor: "#ffff00",
        targetKills: 18,
        obsSpeed: 5.5,
        spawnRate: 20,
        desc: "Drones em formação cybernética com movimento em zigue-zague."
      },
      {
        name: "Fase 4: Tempestade Solar",
        bg: "#220800",
        obsColor: "#ffaa00",
        obsType: "plasma",
        bossColor: "#ff3300",
        bulletColor: "#00ffcc",
        targetKills: 22,
        obsSpeed: 6.5,
        spawnRate: 15,
        desc: "Esferas de plasma em alta velocidade."
      },
      {
        name: "Fase 5: Núcleo do Abismo",
        bg: "#000000",
        obsColor: "#ffffff",
        obsType: "void",
        bossColor: "#ffffff",
        bulletColor: "#ff0055",
        targetKills: 25,
        obsSpeed: 8,
        spawnRate: 10,
        desc: "Caos total! Obstáculos ultra-rápidos e chefão final."
      }
    ];

    // Estado do Jogo
    let score = 0;
    let health = 100;
    let currentLevelIndex = 0;
    let killsInLevel = 0;
    let gameOver = false;
    let levelCompleted = false;
    let frame = 0;

    // Jogador
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 80,
      speed: 0.18
    };

    let targetX = player.x;
    let targetY = player.y;

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      targetX = e.clientX - rect.left;
      targetY = e.clientY - rect.top;
    });

    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      targetX = e.touches[0].clientX - rect.left;
      targetY = e.touches[0].clientY - rect.top;
      e.preventDefault();
    });

    let bullets = [];
    let obstacles = [];
    let crystals = [];
    const stars = [];
    let boss = null;

    for (let i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: 0.5 + Math.random() * 2
      });
    }

    function getCurrentStage() {
      return STAGES[Math.min(currentLevelIndex, STAGES.length - 1)];
    }

    function spawnBoss() {
      const stage = getCurrentStage();
      boss = {
        x: canvas.width / 2,
        y: -80,
        targetY: 110,
        width: 90,
        height: 60,
        hp: 40 + (currentLevelIndex + 1) * 30,
        maxHp: 40 + (currentLevelIndex + 1) * 30,
        dx: 2.5 + currentLevelIndex * 0.8
      };
    }

    function completeLevel() {
      levelCompleted = true;
      const stage = getCurrentStage();
      const title = document.getElementById('level-title');
      const summary = document.getElementById('level-summary');

      if (currentLevelIndex + 1 >= STAGES.length) {
        title.textContent = "¡VITÓRIA TOTAL!";
        summary.textContent = `Você completou todas as 5 fases com ${score} pontos!`;
        document.getElementById('next-btn').style.display = 'none';
      } else {
        title.textContent = `${stage.name} Concluída!`;
        summary.textContent = STAGES[currentLevelIndex + 1].desc;
      }

      levelScreen.style.display = 'flex';
      canvas.style.cursor = 'default';
    }

    function startNextLevel() {
      currentLevelIndex++;
      killsInLevel = 0;
      boss = null;
      bullets = [];
      obstacles = [];
      crystals = [];
      levelCompleted = false;
      health = Math.min(100, health + 40);

      levelScreen.style.display = 'none';
      canvas.style.cursor = 'none';
    }

    function update() {
      if (gameOver || levelCompleted) return;
      frame++;

      const stage = getCurrentStage();

      player.x += (targetX - player.x) * player.speed;
      player.y += (targetY - player.y) * player.speed;

      player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
      player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

      // Disparo do jogador
      if (frame % 7 === 0) {
        bullets.push({ x: player.x, y: player.y - 15, speed: 12 });
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -10) bullets.splice(i, 1);
      }

      // Inimigos
      if (!boss && frame % stage.spawnRate === 0) {
        obstacles.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -30,
          radius: 12 + Math.random() * 14,
          speed: stage.obsSpeed + Math.random() * 1.5,
          hp: 1 + Math.floor(currentLevelIndex / 2),
          type: stage.obsType
        });
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += obs.speed;

        if (obs.type === 'grid') {
          obs.x += Math.sin(frame * 0.12) * 3;
        }

        // Colisão Tiro x Inimigo
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(obs.x - b.x, obs.y - b.y) < obs.radius + 5) {
            bullets.splice(j, 1);
            obs.hp--;

            if (obs.hp <= 0) {
              if (Math.random() > 0.4) crystals.push({ x: obs.x, y: obs.y, speed: 2 });
              score += 20 * (currentLevelIndex + 1);
              killsInLevel++;
              obstacles.splice(i, 1);

              if (killsInLevel >= stage.targetKills && !boss) {
                spawnBoss();
              }
              break;
            }
          }
        }

        // Colisão Inimigo x Jogador
        if (obs && Math.hypot(obs.x - player.x, obs.y - player.y) < obs.radius + 15) {
          health -= 12 + currentLevelIndex * 3;
          obstacles.splice(i, 1);
          if (health <= 0) gameOver = true;
        } else if (obs && obs.y > canvas.height + 40) {
          obstacles.splice(i, 1);
        }
      }

      // Lógica do Boss
      if (boss) {
        if (boss.y < boss.targetY) boss.y += 2;

        boss.x += boss.dx;
        if (boss.x > canvas.width - 50 || boss.x < 50) boss.dx *= -1;

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.abs(b.x - boss.x) < boss.width / 2 && Math.abs(b.y - boss.y) < boss.height / 2) {
            bullets.splice(j, 1);
            boss.hp--;

            if (boss.hp <= 0) {
              score += 1000 * (currentLevelIndex + 1);
              completeLevel();
              break;
            }
          }
        }

        if (Math.hypot(boss.x - player.x, boss.y - player.y) < 55) {
          health -= 2;
          if (health <= 0) gameOver = true;
        }
      }

      // Cristais
      for (let i = crystals.length - 1; i >= 0; i--) {
        const c = crystals[i];
        c.y += c.speed;

        if (Math.hypot(c.x - player.x, c.y - player.y) < 25) {
          score += 35;
          health = Math.min(100, health + 8);
          crystals.splice(i, 1);
        } else if (c.y > canvas.height + 20) {
          crystals.splice(i, 1);
        }
      }

      stars.forEach(s => {
        s.y += s.speed + currentLevelIndex * 0.4;
        if (s.y > canvas.height) s.y = 0;
      });

      document.getElementById('score-val').textContent = score;
      document.getElementById('level-val').textContent = currentLevelIndex + 1;
      document.getElementById('health-val').textContent = Math.max(0, Math.floor(health));
    }

    function draw() {
      const stage = getCurrentStage();

      ctx.fillStyle = stage.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Linhas da Fase Synthwave
      if (stage.obsType === 'grid') {
        ctx.strokeStyle = 'rgba(255, 0, 119, 0.2)';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 35) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = (frame * 3) % 35; y < canvas.height; y += 35) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
      }

      // Estrelas
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

      // Cristais
      ctx.fillStyle = '#00ff88';
      crystals.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
        ctx.fill();
      });

      // Tiros
      ctx.fillStyle = stage.bulletColor;
      bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 14));

      // Desenho dos Inimigos por Tipo
      obstacles.forEach(obs => {
        ctx.fillStyle = stage.obsColor;
        ctx.beginPath();

        if (obs.type === 'meteor') {
          ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
        } else if (obs.type === 'crystal') {
          ctx.moveTo(obs.x, obs.y - obs.radius);
          ctx.lineTo(obs.x + obs.radius, obs.y);
          ctx.lineTo(obs.x, obs.y + obs.radius);
          ctx.lineTo(obs.x - obs.radius, obs.y);
        } else if (obs.type === 'grid') {
          ctx.rect(obs.x - obs.radius, obs.y - obs.radius, obs.radius * 2, obs.radius * 2);
        } else if (obs.type === 'plasma') {
          ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
        } else {
          ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
        }

        ctx.fill();
      });

      // Chefão
      if (boss) {
        ctx.fillStyle = stage.bossColor;
        ctx.fillRect(boss.x - boss.width / 2, boss.y - boss.height / 2, boss.width, boss.height);

        ctx.fillStyle = '#ff0055';
        ctx.fillRect(boss.x - 45, boss.y - 45, 90, 6);
        ctx.fillStyle = '#00ff88';
        ctx.fillRect(boss.x - 45, boss.y - 45, 90 * (boss.hp / boss.maxHp), 6);
      }

      // Nave do Jogador
      if (!gameOver) {
        ctx.fillStyle = '#00e5ff';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - 18);
        ctx.lineTo(player.x - 16, player.y + 12);
        ctx.lineTo(player.x + 16, player.y + 12);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ff0055';
        ctx.fillRect(player.x - 4, player.y + 12, 8, 8 + Math.sin(frame) * 4);
      }

      // Game Over
      if (gameOver) {
        ctx.fillStyle = 'rgba(2, 2, 10, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 28px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('FIM DE JOGO', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#fff';
        ctx.font = '16px Segoe UI';
        ctx.fillText(`Fase Alcançada: ${currentLevelIndex + 1}`, canvas.width / 2, canvas.height / 2 + 15);
        ctx.fillText(`Pontuação Final: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
        ctx.fillText('Recarregue para jogar novamente', canvas.width / 2, canvas.height / 2 + 75);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
