<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defensores do Espaço - Fases Dinâmicas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #050515;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #02020a;
      cursor: none;
    }
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      z-index: 5;
    }
    .score { color: #00e5ff; }
    .level { color: #ffcc00; }
    .health { color: #ff0055; }

    #level-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 21, 0.9);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
    }
    #level-screen h2 {
      font-size: 2.2rem;
      color: #00ff88;
      margin-bottom: 10px;
    }
    #level-screen p {
      font-size: 1.1rem;
      margin-bottom: 25px;
      color: #ccc;
    }
    #next-btn {
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #050515;
      background-color: #00e5ff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
      transition: transform 0.2s, background-color 0.2s;
    }
    #next-btn:hover {
      background-color: #00ff88;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="score">Pontos: <span id="score-val">0</span></div>
      <div class="level">Fase: <span id="level-val">1</span></div>
      <div class="health">Escudo: <span id="health-val">100</span>%</div>
    </div>

    <div id="level-screen">
      <h2 id="level-title">FASE CONCLUÍDA!</h2>
      <p id="level-summary">Você superou os desafios desta região.</p>
      <button id="next-btn" onclick="startNextLevel()">Próxima Fase</button>
    </div>

    <canvas id="canvas" width="480" height="640"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const levelScreen = document.getElementById('level-screen');

    // Estado Geral
    let score = 0;
    let health = 100;
    let level = 1;
    let killsInLevel = 0;
    const KILLS_PER_LEVEL = 12;
    let gameOver = false;
    let levelCompleted = false;
    let frame = 0;

    // Jogador
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 80,
      speed: 0.15
    };

    let targetX = player.x;
    let targetY = player.y;

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      targetX = e.clientX - rect.left;
      targetY = e.clientY - rect.top;
    });

    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      targetX = e.touches[0].clientX - rect.left;
      targetY = e.touches[0].clientY - rect.top;
      e.preventDefault();
    });

    let bullets = [];
    let obstacles = [];
    let crystals = [];
    const stars = [];
    let boss = null;

    // Fundo de estrelas base
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: 0.5 + Math.random() * 1.5
      });
    }

    // Configuração de Estilo por Fase
    function getPhaseConfig() {
      const mode = (level - 1) % 3;
      if (mode === 0) {
        return {
          bg: '#02020a',
          obsColor: '#ff5533',
          obsType: 'meteor', // Meteoros redondos
          bossColor: '#aa00ff',
          name: 'Cinto de Asteroides'
        };
      } else if (mode === 1) {
        return {
          bg: '#1a001a',
          obsColor: '#00ffcc',
          obsType: 'crystal', // Espinhos verticais de toxina
          bossColor: '#ff0055',
          name: 'Nebulosa Toxica'
        };
      } else {
        return {
          bg: '#001a1a',
          obsColor: '#ffcc00',
          obsType: 'drone', // Drones quadrados
          bossColor: '#00e5ff',
          name: 'Setor de Drones Cyber'
        };
      }
    }

    function spawnBoss() {
      const config = getPhaseConfig();
      boss = {
        x: canvas.width / 2,
        y: -80,
        targetY: 100,
        width: 80,
        height: 60,
        hp: 35 + level * 25,
        maxHp: 35 + level * 25,
        dx: 2 + level * 0.7,
        color: config.bossColor
      };
    }

    function completeLevel() {
      levelCompleted = true;
      document.getElementById('level-summary').textContent = `Setor limpo com sucesso! Prepare-se para a próxima zona.`;
      levelScreen.style.display = 'flex';
      canvas.style.cursor = 'default';
    }

    function startNextLevel() {
      level++;
      killsInLevel = 0;
      boss = null;
      bullets = [];
      obstacles = [];
      crystals = [];
      levelCompleted = false;
      health = Math.min(100, health + 35);

      levelScreen.style.display = 'none';
      canvas.style.cursor = 'none';
    }

    // Atualização de Lógica
    function update() {
      if (gameOver || levelCompleted) return;
      frame++;

      const config = getPhaseConfig();

      player.x += (targetX - player.x) * player.speed;
      player.y += (targetY - player.y) * player.speed;

      player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
      player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

      // Atirar
      if (frame % 7 === 0) {
        bullets.push({ x: player.x, y: player.y - 15, speed: 11 });
      }

      // Tiros
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -10) bullets.splice(i, 1);
      }

      // Criar Obstáculos (Mais rápidos e mais frequentes a cada fase)
      const spawnRate = Math.max(8, 30 - level * 3);
      if (!boss && frame % spawnRate === 0) {
        obstacles.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -30,
          radius: 12 + Math.random() * 16,
          speed: (2.5 + level * 0.6) + Math.random() * 2,
          hp: 1 + Math.floor(level / 2),
          type: config.obsType
        });
      }

      // Atualizar Obstáculos
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += obs.speed;

        // Movimento extra para Drones na Fase 3
        if (obs.type === 'drone') {
          obs.x += Math.sin(frame * 0.1) * 2;
        }

        // Colisão com Tiros
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(obs.x - b.x, obs.y - b.y) < obs.radius + 5) {
            bullets.splice(j, 1);
            obs.hp--;

            if (obs.hp <= 0) {
              if (Math.random() > 0.4) crystals.push({ x: obs.x, y: obs.y, speed: 2 });
              score += 15 * level;
              killsInLevel++;
              obstacles.splice(i, 1);

              if (killsInLevel >= KILLS_PER_LEVEL && !boss) {
                spawnBoss();
              }
              break;
            }
          }
        }

        // Colisão com Jogador
        if (obs && Math.hypot(obs.x - player.x, obs.y - player.y) < obs.radius + 15) {
          health -= 15 + level * 2;
          obstacles.splice(i, 1);
          if (health <= 0) gameOver = true;
        } else if (obs && obs.y > canvas.height + 40) {
          obstacles.splice(i, 1);
        }
      }

      // Lógica do Boss
      if (boss) {
        if (boss.y < boss.targetY) boss.y += 2;

        boss.x += boss.dx;
        if (boss.x > canvas.width - 50 || boss.x < 50) boss.dx *= -1;

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.abs(b.x - boss.x) < boss.width / 2 && Math.abs(b.y - boss.y) < boss.height / 2) {
            bullets.splice(j, 1);
            boss.hp--;

            if (boss.hp <= 0) {
              score += 600 * level;
              completeLevel();
              break;
            }
          }
        }

        if (Math.hypot(boss.x - player.x, boss.y - player.y) < 50) {
          health -= 1.5;
          if (health <= 0) gameOver = true;
        }
      }

      // Cristais
      for (let i = crystals.length - 1; i >= 0; i--) {
        const c = crystals[i];
        c.y += c.speed;

        if (Math.hypot(c.x - player.x, c.y - player.y) < 25) {
          score += 30;
          health = Math.min(100, health + 8);
          crystals.splice(i, 1);
        } else if (c.y > canvas.height + 20) {
          crystals.splice(i, 1);
        }
      }

      // Estrelas
      stars.forEach(s => {
        s.y += s.speed + (level * 0.3);
        if (s.y > canvas.height) s.y = 0;
      });

      document.getElementById('score-val').textContent = score;
      document.getElementById('level-val').textContent = level;
      document.getElementById('health-val').textContent = Math.max(0, Math.floor(health));
    }

    // Renderização
    function draw() {
      const config = getPhaseConfig();

      // Fundo Dinâmico por Fase
      ctx.fillStyle = config.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Efeito de Linhas de Grade na Fase Synthwave (Modo 3)
      if ((level - 1) % 3 === 2) {
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.15)';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = (frame * 2) % 40; y < canvas.height; y += 40) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
      }

      // Estrelas
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

      // Cristais
      ctx.fillStyle = '#00ff88';
      crystals.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
        ctx.fill();
      });

      // Tiros
      ctx.fillStyle = '#00e5ff';
      bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 12));

      // Obstáculos Dinâmicos
      obstacles.forEach(obs => {
        ctx.fillStyle = config.obsColor;
        ctx.beginPath();

        if (obs.type === 'meteor') {
          // Redondo
          ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
        } else if (obs.type === 'crystal') {
          // Diamante/Espinho
          ctx.moveTo(obs.x, obs.y - obs.radius);
          ctx.lineTo(obs.x + obs.radius, obs.y);
          ctx.lineTo(obs.x, obs.y + obs.radius);
          ctx.lineTo(obs.x - obs.radius, obs.y);
        } else {
          // Quadrado (Drone)
          ctx.rect(obs.x - obs.radius, obs.y - obs.radius, obs.radius * 2, obs.radius * 2);
        }

        ctx.fill();
      });

      // Chefão
      if (boss) {
        ctx.fillStyle = boss.color;
        ctx.fillRect(boss.x - boss.width / 2, boss.y - boss.height / 2, boss.width, boss.height);

        // Barra de Vida
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(boss.x - 40, boss.y - 45, 80, 6);
        ctx.fillStyle = '#00ff88';
        ctx.fillRect(boss.x - 40, boss.y - 45, 80 * (boss.hp / boss.maxHp), 6);
      }

      // Jogador
      if (!gameOver) {
        ctx.fillStyle = '#00e5ff';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - 18);
        ctx.lineTo(player.x - 16, player.y + 12);
        ctx.lineTo(player.x + 16, player.y + 12);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ff0055';
        ctx.fillRect(player.x - 4, player.y + 12, 8, 8 + Math.sin(frame) * 4);
      }

      // Game Over
      if (gameOver) {
        ctx.fillStyle = 'rgba(2, 2, 10, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 28px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('FIM DE JOGO', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#fff';
        ctx.font = '16px Segoe UI';
        ctx.fillText(`Fase Alcançada: ${level}`, canvas.width / 2, canvas.height / 2 + 15);
        ctx.fillText(`Pontuação Final: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
        ctx.fillText('Recarregue a página para jogar novamente', canvas.width / 2, canvas.height / 2 + 75);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
