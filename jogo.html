<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Sobrevivência 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #111;
      color: #fff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #gameCanvas {
      background-color: #87ceeb;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      border-radius: 8px;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #4CAF50;
      pointer-events: none;
    }
    #ui h2 { font-size: 1.1rem; color: #4CAF50; margin-bottom: 5px; }
    #ui p { margin: 3px 0; font-size: 0.9rem; }
    #controls {
      position: absolute;
      bottom: 20px;
      background: rgba(0,0,0,0.6);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="ui">
    <h2>Sobrevivência 3D</h2>
    <p>Vida: <span id="health">100</span>%</p>
    <p>Fome: <span id="hunger">100</span>%</p>
    <p>Madeira: <span id="wood">0</span> | Pedra: <span id="stone">0</span></p>
  </div>

  <div id="controls">Controles: <b>WASD</b> ou <b>Setas</b> para mover o personagem</div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Estado do Jogador
    const player = {
      x: 0,
      y: 0,
      z: 0,
      angle: 0,
      health: 100,
      hunger: 100,
      wood: 0,
      stone: 0
    };

    // Teclas
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Obstáculos e Recursos no Mundo 3D
    const objects = [];
    for (let i = 0; i < 25; i++) {
      objects.push({
        x: (Math.random() - 0.5) * 1000,
        z: (Math.random() - 0.5) * 1000,
        type: Math.random() > 0.4 ? 'tree' : 'rock',
        size: 20 + Math.random() * 15
      });
    }

    // Projeção 3D para 2D simples
    const fov = 300;
    function project(x, y, z) {
      const scale = fov / (fov + z);
      return {
        x: canvas.width / 2 + x * scale,
        y: canvas.height / 2 + y * scale,
        scale: scale
      };
    }

    // Loop de Atualização
    function update() {
      if (player.health <= 0) return;

      let speed = 3;
      let dx = 0;
      let dz = 0;

      if (keys['w'] || keys['arrowup']) dz += speed;
      if (keys['s'] || keys['arrowdown']) dz -= speed;
      if (keys['a'] || keys['arrowleft']) dx -= speed;
      if (keys['d'] || keys['arrowright']) dx += speed;

      if (dx !== 0 || dz !== 0) {
        player.x += dx;
        player.z += dz;
        player.angle = Math.atan2(dx, dz);
        player.hunger -= 0.02;
      } else {
        player.hunger -= 0.005;
      }

      if (player.hunger <= 0) {
        player.hunger = 0;
        player.health -= 0.05;
      }

      // Colisão e Coleta de Recursos
      for (let i = objects.length - 1; i >= 0; i--) {
        const obj = objects[i];
        const dist = Math.hypot(player.x - obj.x, player.z - obj.z);

        if (dist < obj.size) {
          if (obj.type === 'tree') player.wood += 1;
          if (obj.type === 'rock') player.stone += 1;

          // Reposiciona o recurso longe
          obj.x = (Math.random() - 0.5) * 1000;
          obj.z = (Math.random() - 0.5) * 1000;
        }
      }

      // Atualiza HUD
      document.getElementById('health').textContent = Math.max(0, Math.floor(player.health));
      document.getElementById('hunger').textContent = Math.max(0, Math.floor(player.hunger));
      document.getElementById('wood').textContent = player.wood;
      document.getElementById('stone').textContent = player.stone;
    }

    // Loop de Renderização Gráfica
    function draw() {
      // Limpa a tela (Céu)
      ctx.fillStyle = '#87ceeb';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Chão
      ctx.fillStyle = '#458b00';
      ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

      // Desenhar Objetos do Mundo (ordenados por distância do jogador)
      const renderList = objects.map(obj => {
        const relX = obj.x - player.x;
        const relZ = obj.z - player.z;
        return { ...obj, relX, relZ, dist: Math.hypot(relX, relZ) };
      }).sort((a, b) => b.dist - a.dist);

      renderList.forEach(obj => {
        // Câmera posicionada atrás do jogador
        const camZ = obj.relZ + 150; 
        if (camZ > 10) {
          const p = project(obj.relX, 30, camZ);

          if (obj.type === 'tree') {
            // Tronco
            ctx.fillStyle = '#5c4033';
            ctx.fillRect(p.x - 5 * p.scale, p.y - 10 * p.scale, 10 * p.scale, 40 * p.scale);
            // Copa da Árvore
            ctx.fillStyle = '#1e5631';
            ctx.beginPath();
            ctx.arc(p.x, p.y - 20 * p.scale, 25 * p.scale, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Pedra
            ctx.fillStyle = '#7f8c8d';
            ctx.beginPath();
            ctx.arc(p.x, p.y + 15 * p.scale, 18 * p.scale, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });

      // Desenhar o Personagem em Terceira Pessoa (Fixo no Centro)
      const pCenter = { x: canvas.width / 2, y: canvas.height / 2 + 40 };

      // Sombra
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(pCenter.x, pCenter.y + 20, 15, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Corpo
      ctx.fillStyle = '#2980b9';
      ctx.fillRect(pCenter.x - 10, pCenter.y - 10, 20, 25);

      // Cabeça
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.arc(pCenter.x, pCenter.y - 20, 10, 0, Math.PI * 2);
      ctx.fill();

      // Indicador de Direção do Personagem
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pCenter.x, pCenter.y - 10);
      ctx.lineTo(
        pCenter.x + Math.sin(player.angle) * 20,
        pCenter.y - 10 + Math.cos(player.angle) * 20
      );
      ctx.stroke();

      // Game Over
      if (player.health <= 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER - Você Morreu', canvas.width / 2, canvas.height / 2);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
