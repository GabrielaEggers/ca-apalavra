<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobrevivência 3D em Terceira Pessoa</title>
  <link rel="stylesheet" href="style.css">
  <!-- Importação da biblioteca Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui-container">
    <div class="hud">
      <p>Vida: <span id="health-val">100</span>%</p>
      <p>Fome: <span id="hunger-val">100</span>%</p>
      <p>Madeira: <span id="wood-val">0</span> | Pedra: <span id="stone-val">0</span> | Comida: <span id="food-val">0</span></p>
    </div>
    <div class="controls-info">
      Controles: <b>WASD</b> / <b>Setas</b> para andar
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
