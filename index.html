<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Caça-Palavras: Conhecimentos Gerais</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Caça-Palavras Mundial</h1>
    <p class="subtitle">Encontre as 8 palavras de conhecimentos gerais escondidas na grade!</p>

    <div class="game-area">
      <div id="grid" class="grid"></div>

      <div class="sidebar">
        <h2>Palavras</h2>
        <ul id="word-list"></ul>
        <button id="reset-btn">Reiniciar Jogo</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
